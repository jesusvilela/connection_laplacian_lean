name: dev covariant observability

on:
  push:
    branches: [dev]
    paths:
      - 'research/covariant_observability/**'
      - '.github/workflows/dev-covariant-observability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Reproduce gauge, holonomy, Riesz and spectral-square tests
        shell: bash
        run: |
          set -euo pipefail
          python research/covariant_observability/experiment.py --verify | tee "${RUNNER_TEMP}/covariant-observability.json"
      - name: Archive finite-size evidence (not a Lean proof)
        uses: actions/upload-artifact@v4
        with:
          name: covariant-observability-seed-20261028
          path: ${{ runner.temp }}/covariant-observability.json
