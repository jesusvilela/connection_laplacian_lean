name: dev covariant observability

on:
  push:
    branches: [dev]
    paths:
      - 'research/covariant_observability/**'
      - 'ConnectionLaplacian/Experimental/**'
      - '.github/workflows/dev-covariant-observability.yml'
  workflow_dispatch:

concurrency:
  group: covariant-observability-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  finite-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Reproduce gauge, holonomy, Riesz and spectral-square tests
        shell: bash
        run: |
          set -euo pipefail
          python research/covariant_observability/experiment.py --verify | tee /tmp/covariant-observability.json
      - name: Verify exact flat-cycle Riesz cotangent kernel
        shell: bash
        run: |
          set -euo pipefail
          python research/covariant_observability/test_endpoint.py | tee /tmp/covariant-endpoint.json
      - name: Verify exact twisted-cycle Riesz kernel across phases
        shell: bash
        run: |
          set -euo pipefail
          python research/covariant_observability/test_twisted_endpoint.py | tee /tmp/covariant-twisted-endpoint.json
      - name: Cross-check Z2 Laplacian factorization on exhaustive small graphs
        shell: bash
        run: |
          set -euo pipefail
          python research/covariant_observability/test_z2_exact.py | tee /tmp/z2-exact-oracle.json
      - name: Test gauge-invariant two-cycle nonabelian observability
        shell: bash
        run: |
          set -euo pipefail
          python research/covariant_observability/test_polyholonomy.py | tee /tmp/polyholonomy.json
      - name: Verify finite mixed-holonomy moment visibility depth
        shell: bash
        run: |
          set -euo pipefail
          python research/covariant_observability/test_visibility_depth.py | tee /tmp/visibility-depth.json
      - name: Verify analytic SU2 Schur-complement characteristic polynomials
        shell: bash
        run: |
          set -euo pipefail
          python research/covariant_observability/test_spectral_charpoly.py | tee /tmp/spectral-charpoly.json
      - name: Verify held-out diffusive holonomy visibility scaling
        shell: bash
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 python research/covariant_observability/test_heat_visibility.py | tee /tmp/heat-visibility.json
      - name: Archive finite-size evidence (not a Lean proof)
        uses: actions/upload-artifact@v4
        with:
          name: covariant-observability-seed-20261028
          path: |
            /tmp/covariant-observability.json
            /tmp/covariant-endpoint.json
            /tmp/z2-exact-oracle.json
            /tmp/covariant-twisted-endpoint.json
            /tmp/polyholonomy.json
            /tmp/visibility-depth.json
            /tmp/spectral-charpoly.json
            /tmp/heat-visibility.json

  experimental-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get pinned Mathlib cache
        run: lake exe cache get || true
      - name: Compile standalone experimental bridge
        run: |
          lake build ConnectionLaplacian.Experimental.UnitaryEdge
          lake build ConnectionLaplacian.Experimental.IncidenceEnergy
          lake build ConnectionLaplacian.Experimental.EdgeGram
          lake build ConnectionLaplacian.Experimental.AbelianBoundary
      - name: Report exact axiom dependency of new declarations
        shell: bash
        run: |
          set -euo pipefail
          cat > ExperimentalAxiomAudit.lean <<'LEAN'
          import ConnectionLaplacian.Experimental.AbelianBoundary
          import ConnectionLaplacian.Experimental.EdgeGram
          #print axioms ConnectionLaplacian.ConnGraph.edgeMatrix_involution
          #print axioms ConnectionLaplacian.ConnGraph.edgeMatrix_transpose_eq
          #print axioms ConnectionLaplacian.ConnGraph.edgeMatrix_orthogonal
          #print axioms ConnectionLaplacian.ConnGraph.edgeTransport_involution
          #print axioms ConnectionLaplacian.ConnGraph.edgeEnergy_reverse
          #print axioms ConnectionLaplacian.ConnGraph.edgeEnergy_expand
          #print axioms ConnectionLaplacian.ConnGraph.edgeIncidence_gram
          #print axioms ConnectionLaplacian.ConnGraph.original_edge_transports_commute
          #print axioms ConnectionLaplacian.ConnGraph.original_edge_fixes_symmetric_mode
          LEAN
          lake env lean ExperimentalAxiomAudit.lean 2>&1 | tee experimental-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          output = Path("experimental-axioms.log").read_text()
          names = [
              "ConnectionLaplacian.ConnGraph.edgeMatrix_involution",
              "ConnectionLaplacian.ConnGraph.edgeMatrix_transpose_eq",
              "ConnectionLaplacian.ConnGraph.edgeMatrix_orthogonal",
              "ConnectionLaplacian.ConnGraph.edgeTransport_involution",
              "ConnectionLaplacian.ConnGraph.edgeEnergy_reverse",
              "ConnectionLaplacian.ConnGraph.edgeEnergy_expand",
              "ConnectionLaplacian.ConnGraph.edgeIncidence_gram",
              "ConnectionLaplacian.ConnGraph.original_edge_transports_commute",
              "ConnectionLaplacian.ConnGraph.original_edge_fixes_symmetric_mode",
          ]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in names:
              n = re.escape(name)
              match = re.search(r"'" + n + r"' depends on axioms:\s*\[([^\]]*)\]", output)
              no_axioms = re.search(r"'" + n + r"' does not depend on any axioms", output)
              if not match and not no_axioms:
                  raise SystemExit("No axiom report for " + name)
              if match:
                  used = {item.strip() for item in match.group(1).split(",") if item.strip()}
                  if not used.issubset(allowed):
                      raise SystemExit("Unexpected axiom in " + name + ": " + str(used - allowed))
          print("Experimental declarations: 9/9 checked, no nonstandard axioms")
          PY
