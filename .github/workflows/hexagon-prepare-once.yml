name: Temporary Hexagon manuscript PDF refresh

on:
  push:
    branches:
      - submission/hexagon-paper-v0.0.7
    paths:
      - .github/workflows/hexagon-prepare-once.yml
      - paper/paper.tex

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install PDF build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-fonts-extra \
            cm-super poppler-utils

      - name: Compile, verify, and refresh committed paper
        run: |
          set -euo pipefail
          mkdir -p paperbuild
          for i in 1 2 3; do
            pdflatex -halt-on-error -interaction=nonstopmode \
              -output-directory=paperbuild paper/paper.tex \
              > paperbuild/run-${i}.log 2>&1 || {
                tail -n 100 paperbuild/run-${i}.log
                exit 1
              }
          done
          test -s paperbuild/paper.pdf
          pdfinfo paperbuild/paper.pdf | tee paperbuild/pdfinfo.txt
          pdftotext -layout paperbuild/paper.pdf paperbuild/paper.txt
          test -s paperbuild/paper.txt
          if grep -E 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|undefined control sequence' paperbuild/run-3.log; then
            exit 1
          fi
          cp paperbuild/paper.pdf paper/paper.pdf
          git diff --stat -- paper/paper.pdf
          git add paper/paper.pdf
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'paper: regenerate checked PDF for Hexagon v0.0.7'
            git push origin HEAD:submission/hexagon-paper-v0.0.7
          fi

      - name: Preserve PDF and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hexagon-paper-pdf
          path: paperbuild/
          retention-days: 30
