name: Temporary v0.0.8 Hexagon typeset and verify
on:
  push:
    branches:
      - paper/hexagon-typography-v0.0.8
    paths:
      - .github/workflows/hexagon-typeset-once.yml
      - paper/paper.tex
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-fonts-extra \
            cm-super poppler-utils
      - name: Compile and inspect manuscript
        run: |
          set -euo pipefail
          mkdir -p paperbuild
          git rev-parse HEAD > paperbuild/source-commit.txt
          sha256sum paper/paper.tex > paperbuild/source-sha256.txt
          for i in 1 2 3; do
            pdflatex -halt-on-error -interaction=nonstopmode \
              -output-directory=paperbuild paper/paper.tex \
              > paperbuild/run-${i}.log 2>&1 || {
                tail -n 100 paperbuild/run-${i}.log
                exit 1
              }
          done
          test -s paperbuild/paper.pdf
          pdfinfo paperbuild/paper.pdf | tee paperbuild/pdfinfo.txt
          pdftotext -layout paperbuild/paper.pdf paperbuild/paper.txt
          test -s paperbuild/paper.txt
          if grep -E 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|undefined control sequence' paperbuild/run-3.log; then
            exit 1
          fi
          pages=$(pdfinfo paperbuild/paper.pdf | awk '/^Pages:/{print $2}')
          echo "Revised manuscript pages: $pages"
          pdftotext -f "$pages" -l "$pages" paperbuild/paper.pdf paperbuild/last-page.txt
          echo "Last page words: $(wc -w < paperbuild/last-page.txt)"
          for n in 16 17 18 19 "$pages"; do
            if [ "$n" -le "$pages" ]; then
              pdftoppm -f "$n" -l "$n" -scale-to 1300 -png -singlefile \
                paperbuild/paper.pdf "paperbuild/page-$n"
            fi
          done
          cp paperbuild/paper.pdf paper/paper.pdf
          git add paper/paper.pdf
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'paper: regenerate pagination-verified PDF for v0.0.8'
            git push origin HEAD:paper/hexagon-typography-v0.0.8
          fi
      - name: Preserve PDF and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-layout-v008
          path: paperbuild/
          retention-days: 30
