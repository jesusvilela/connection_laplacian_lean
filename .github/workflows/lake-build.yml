name: lake build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Print toolchain
        run: |
          lean --version
          lake --version

      - name: Get Mathlib cache
        run: lake exe cache get || true

      - name: Audit source trust boundary
        run: python3 scripts/audit_trust.py

      - name: Build
        run: lake build

      - name: Audit theorem axioms
        run: |
          lake env lean ConnectionLaplacian/AxiomAudit.lean 2>&1 | tee axiom-audit.log
          python3 scripts/audit_trust.py --axiom-output axiom-audit.log

      - name: Cycle comparator harness integrity
        run: python3 scripts/audit_cycle_comparator.py

      - name: Exact graph/cycle matrix-reindex probes
        run: python3 findings/round10/test_cycle_graph_transfer.py

      - name: Elaborate comparator challenge and solution
        run: |
          lake build Hardening.CycleChallenge Hardening.CycleSolution \
            Hardening.CycleNegative.BadChallenge \
            Hardening.CycleNegative.BadSolution

