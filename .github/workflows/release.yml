name: Create release

# Release notes come from .github/release-notes/<tag>.md, and CITATION.cff
# must already carry the tag as its version. The release attaches the
# reviewed, committed paper/paper.pdf; the LaTeX run below is a compile
# check only and never replaces that file.

on:
  push:
    tags:
      - 'v.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v.0.0.6); notes are read from .github/release-notes/<tag>.md'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release metadata
        run: |
          set -euo pipefail
          notes=".github/release-notes/${TAG}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi
          cff_version=$(sed -n 's/^version: *"\(.*\)" *$/\1/p' CITATION.cff)
          if [ "$cff_version" != "$TAG" ]; then
            echo "::error::CITATION.cff version '$cff_version' does not match tag '$TAG'"
            exit 1
          fi
          test -s paper/paper.pdf

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-fonts-extra \
            cm-super

      - name: Check that the manuscript compiles
        run: |
          set -euo pipefail
          mkdir -p /tmp/paperbuild
          for i in 1 2 3; do
            pdflatex -halt-on-error -interaction=nonstopmode \
              -output-directory=/tmp/paperbuild paper/paper.tex \
              > /tmp/paperbuild/run-${i}.log 2>&1 || {
                tail -n 100 /tmp/paperbuild/run-${i}.log
                exit 1
              }
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: .github/release-notes/${{ env.TAG }}.md
          files: paper/paper.pdf
          draft: false
          prerelease: false
